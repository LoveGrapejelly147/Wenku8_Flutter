name: Preview APK (arm64)

# Builds a debug-signed arm64 preview APK for the Legado book-source
# branch and uploads it as an artifact. Runs automatically on the open
# PR and can also be started by hand from the Actions tab.
# The signed release flow (sign-distribution.yml) only runs on the
# upstream repo, so it is not used here.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | "$SDKMANAGER" --licenses
      - name: Run book-source unit tests
        run: flutter test test/book_source_rule_test.dart test/book_source_repository_test.dart test/reading_rules_test.dart
      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk wenku8-android-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-android-arm64-v8a-release
          path: wenku8-android-arm64-v8a-release.apk
          retention-days: 14
